services:
  app:
    build:
      context: .
      dockerfile: infrastructure/docker/app.Dockerfile
    container_name: lavss_monitor_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "lavss monitor"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-lavss_monitor}
      DB_USERNAME: ${DB_USERNAME:-lavss_dev}
      DB_PASSWORD: ${DB_PASSWORD:-dev_secret_123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/var/www/html
    depends_on:
      - postgres
      - redis

  node:
    image: node:20-alpine
    container_name: lavss_monitor_vite
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: lavss_monitor_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-lavss_monitor}
      POSTGRES_USER: ${DB_USERNAME:-lavss_dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_secret_123}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lavss_monitor_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
